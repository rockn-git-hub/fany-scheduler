name: FANYスケジューラ

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Windows runner label for manual testing (empty uses configured default)
        required: false
        type: string

concurrency:
  group: fany-event-update
  cancel-in-progress: false

permissions:
  contents: write  # リポジトリへの書き込み許可

jobs:
  run-script:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ (inputs.runner_label != '' || vars.FANY_RUNNER_LABEL != '') && fromJSON(format('["self-hosted","Windows","X64","{0}"]', inputs.runner_label || vars.FANY_RUNNER_LABEL)) || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Tokyo

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        if: runner.os != 'Windows'
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        if: runner.os != 'Windows'
        run: |
          pip install -r requirements.txt

      - name: Git設定 & 最新取得
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main

      - name: スクリプトを実行
        if: runner.os != 'Windows'
        run: python kinzoku_fany.py

      - name: Windowsでスクリプトを実行
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/Invoke-FanyWindows.ps1

      - name: 変更をコミット & Push
        run: |
          git add kinzoku_bat_events.html previous_events.json
          if ! git diff --cached --quiet; then
            git commit -m "✅ データ更新（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）"
          fi
          git push

      - name: LINEに通知を送信
        env:
          LINE_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_USER_ID }}
        run: |
          echo "[TIME] before line send $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
          MESSAGE="✅ 金属バット公演一覧が更新されました！\nhttps://rockn-git-hub.github.io/fany-scheduler/kinzoku_bat_events.html"
          curl -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{
              "to": "'"$LINE_TO"'",
              "messages":[
                  {
                      "type":"text",
                      "text":"'"$MESSAGE"'"
                  }
              ]
          }'

name: FANYスケジューラ

on:
  workflow_dispatch:
    inputs:
      message:
        description: Local FANY retrieval test result
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-script:
    if: github.ref == 'refs/heads/codex/local-fany-line-test-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Tokyo

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: LINEに通知を送信
        env:
          LINE_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_USER_ID }}
          TEST_MESSAGE: ${{ inputs.message }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          message = os.environ['TEST_MESSAGE']
          if not message.startswith('【PC経由の公演取得テスト】') or len(message) > 4500:
              raise ValueError('Unexpected test message')
          payload = json.dumps({
              'to': os.environ['LINE_TO'],
              'messages': [{'type': 'text', 'text': message}],
          }, ensure_ascii=False).encode('utf-8')
          request = Request('https://api.line.me/v2/bot/message/push', data=payload, headers={
              'Authorization': 'Bearer ' + os.environ['LINE_TOKEN'],
              'Content-Type': 'application/json',
          })
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
              print('LINE response status:', response.status)
              print('Sent message count:', len(result.get('sentMessages', [])))
              print('Sent at JST:', datetime.datetime.now(ZoneInfo('Asia/Tokyo')).isoformat())
          PY

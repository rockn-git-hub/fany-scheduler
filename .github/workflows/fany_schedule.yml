name: FANYスケジューラ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/diagnose-fany-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: '1'

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: |
          pip install -r requirements.txt

      - name: Diagnose FANY page retrieval
        run: python diagnostics/fany_probe.py

      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fany-diagnostics
          path: fany-diagnostics/
          retention-days: 7
